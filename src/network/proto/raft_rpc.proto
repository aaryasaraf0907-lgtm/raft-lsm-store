syntax = "proto3";

package raftkv.network.proto;

enum CommandType {
  COMMAND_TYPE_PUT = 0;
  COMMAND_TYPE_DELETE = 1;
  COMMAND_TYPE_NOOP = 2;
}

message Command {
  CommandType type = 1;
  string key = 2;
  string value = 3;
}

message LogEntry {
  uint64 term = 1;
  uint64 index = 2;
  Command command = 3;
}

message RequestVoteRequest {
  uint64 term = 1;
  uint32 candidate_id = 2;
  uint64 last_log_index = 3;
  uint64 last_log_term = 4;
}

message RequestVoteReply {
  uint64 term = 1;
  bool vote_granted = 2;
}

message AppendEntriesRequest {
  uint64 term = 1;
  uint32 leader_id = 2;
  uint64 prev_log_index = 3;
  uint64 prev_log_term = 4;
  repeated LogEntry entries = 5;
  uint64 leader_commit = 6;
}

message AppendEntriesReply {
  uint64 term = 1;
  bool success = 2;
  uint64 match_index = 3;
}
