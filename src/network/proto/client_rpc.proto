syntax = "proto3";

package raftkv.network.proto;

enum ClientStatus {
  CLIENT_STATUS_OK = 0;
  CLIENT_STATUS_INVALID_ARGUMENT = 1;
  CLIENT_STATUS_NOT_LEADER = 2;
  CLIENT_STATUS_NOT_COMMITTED = 3;
  CLIENT_STATUS_OUTCOME_UNKNOWN = 4;
  CLIENT_STATUS_STOPPED = 5;
  CLIENT_STATUS_NOT_FOUND = 6;
  CLIENT_STATUS_UNAVAILABLE = 7;
  CLIENT_STATUS_INTERNAL_ERROR = 8;
  CLIENT_STATUS_DUPLICATE_OUTCOME_UNKNOWN = 9;
  // This client's session was forgotten (idle too long, or too many clients), so the request was NOT
  // applied: it might have been a retry of one applied before. Start a new session (new client id).
  CLIENT_STATUS_SESSION_EXPIRED = 10;
}

message PutRequest {
  uint64 client_id = 1;
  uint64 seq = 2;
  bytes key = 3;
  bytes value = 4;
  uint32 timeout_ms = 5;
}

message DeleteRequest {
  uint64 client_id = 1;
  uint64 seq = 2;
  bytes key = 3;
  uint32 timeout_ms = 4;
}

message GetRequest {
  bytes key = 1;
  uint32 timeout_ms = 2;
}

message WriteResponse {
  ClientStatus status = 1;
  string error_message = 2;
  uint32 leader_id_hint = 3;
}

message GetResponse {
  ClientStatus status = 1;
  string error_message = 2;
  uint32 leader_id_hint = 3;
  bytes value = 4;
}

// What a node knows about itself: for operators, the CLI and tests.
message StatusRequest {}

message StatusResponse {
  uint32 node_id = 1;
  string role = 2;  // "leader", "follower" or "candidate"
  uint64 term = 3;
  uint32 leader_id_hint = 4;  // 0 if unknown
  uint64 commit_index = 5;
  uint64 last_applied = 6;
  uint64 log_length = 7;      // log entries still stored
  uint64 snapshot_index = 8;  // 0 = no snapshot
  repeated uint32 members = 9;  // the voting members in this node's configuration
}

// ---- membership changes (administration; sent to the leader) ----
message AddServerRequest {
  uint32 node_id = 1;
  string raft_address = 2;  // where the other nodes reach the new node's Raft service (HOST:PORT)
  uint32 timeout_ms = 3;    // how long the leader may take, catch-up included (0 = 30 s)
}
message RemoveServerRequest {
  uint32 node_id = 1;
  uint32 timeout_ms = 2;  // 0 = 30 s
}
enum MembershipStatus {
  MEMBERSHIP_OK = 0;              // committed (or there was nothing to change)
  MEMBERSHIP_NOT_LEADER = 1;      // ask leader_id_hint
  MEMBERSHIP_IN_PROGRESS = 2;     // another change is not committed yet: retry shortly
  MEMBERSHIP_INVALID = 3;         // bad id or address, or removing the last member
  MEMBERSHIP_CATCH_UP_FAILED = 4; // the new node did not catch up in time; nothing changed
  MEMBERSHIP_TIMEOUT = 5;         // not committed in time: it may still take effect
  MEMBERSHIP_LOST = 6;            // replaced by a new leader: nothing changed
  MEMBERSHIP_STOPPED = 7;
  MEMBERSHIP_UNSUPPORTED = 8;     // this server cannot change membership
}
message MembershipReply {
  MembershipStatus status = 1;
  uint32 leader_id_hint = 2;
  string error_message = 3;
}

service ClientRpc {
  rpc NodeStatus(StatusRequest) returns (StatusResponse);
  rpc Put(PutRequest) returns (WriteResponse);
  rpc Get(GetRequest) returns (GetResponse);
  rpc Delete(DeleteRequest) returns (WriteResponse);
  rpc AddServer(AddServerRequest) returns (MembershipReply);
  rpc RemoveServer(RemoveServerRequest) returns (MembershipReply);
}
